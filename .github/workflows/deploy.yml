# Секреты в GitHub: Settings → Secrets and variables → Actions
#   SSH_HOST      — IP или домен сервера (например emiemiemiemi.pro)
#   SSH_USER      — пользователь SSH (например anaforever)
#   SSH_PRIVATE_KEY — приватный ключ (содержимое id_rsa, без пароля)
#   SSH_PORT      — опционально, по умолчанию 22
#   DEPLOY_PATH   — опционально, по умолчанию ~/emi_back

name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build:
    name: Build & test compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prisma generate
        run: npx prisma generate

      - name: TypeScript build
        run: npm run build

  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: "22"
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            if [ -z "${DEPLOY_PATH}" ]; then DEPLOY_PATH="$HOME/emi_back"; fi
            cd "$DEPLOY_PATH"
            git fetch origin master
            git reset --hard origin/master
            bash scripts/deploy-on-server.sh
